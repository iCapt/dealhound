<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealHound — Black Friday deals that are actually deals</title>
<meta name="description" content="75 Black Friday deals, each checked against a real usual price and compared at other stores. Scored 0–95. No fake usual prices.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="#/">🐕 DealHound</a>
    <p class="tagline">Black Friday deals that are actually deals.</p>
    <nav class="topnav">
      <a href="#/">All deals</a>
      <a href="#/top10">Top 10</a>
      <a href="#/compare">Compare</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="stats"></div>
  <p id="method" class="method"></p>
  <div class="search-row" id="searchRow">
    <label class="search">Search
      <input id="q" type="search" placeholder="Try “airpods”, “dyson”, “lego”…">
    </label>
    <label class="sort">Sort
      <select id="sort">
        <option value="score">Best score first</option>
        <option value="pct">Biggest % off first</option>
        <option value="save">Most dollars saved first</option>
        <option value="price">Lowest price first</option>
      </select>
    </label>
  </div>
  <div id="strip"></div>
  <div id="filters"></div>
  <div id="active"></div>
  <div id="view"></div>
</main>
<div id="footer" class="wrap"></div>
<script type="module" src="main.js"></script>
</body>
</html>
